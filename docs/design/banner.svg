<!-- TV launcher banner source. Render at 640x360 (headless Chrome screenshot, or VectorCraft
     docs/design/ic_launcher.vectorcraft artboard "Banner 8 (banner.svg)" at 2x) to
     app/src/main/res/drawable-xhdpi/banner.png. Mark matches ic_launcher_foreground.xml. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 320 180">
  <defs>
    <style>@font-face { font-family: "Amiri"; src: url("../../app/src/main/res/font/amiri.ttf"); }</style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03211B"/><stop offset="0.6" stop-color="#075245"/><stop offset="1" stop-color="#129C7B"/></linearGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="70" cy="96" r="92">
      <stop offset="0" stop-color="#F5C95F" stop-opacity="0.34"/><stop offset="0.45" stop-color="#F5C95F" stop-opacity="0.10"/><stop offset="1" stop-color="#F5C95F" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="54" y1="37" x2="54" y2="78">
      <stop offset="0" stop-color="#F7E4AE"/><stop offset="0.5" stop-color="#F5C95F"/><stop offset="1" stop-color="#A98541"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFF0C8"/></linearGradient>
    <!-- Khatam (8-point star) lattice, shown faintly on the right. -->
    <pattern id="khatam" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M13,2 L24,13 L13,24 L2,13 Z M5.2,5.2 H20.8 V20.8 H5.2 Z" fill="none" stroke="#F5C95F" stroke-width="0.45"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.16"/></linearGradient>
    <mask id="m"><rect width="320" height="180" fill="url(#fade)"/></mask>
  
    <linearGradient id="c8-linear-gradient-1" x1="0" y1="0" x2="320" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#129c7b"/>
      <stop offset="1" stop-color="#053b31"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#sky)"/>
  <rect width="320" height="180" fill="url(#khatam)" mask="url(#m)"/>
  <rect width="320" height="180" fill="url(#halo)"/>

  <!-- stars -->
  <g fill="#FFF7E0">
    <circle cx="22" cy="20" r="0.9" opacity="0.8"/><circle cx="118" cy="16" r="0.7" opacity="0.6"/>
    <circle cx="150" cy="34" r="0.6" opacity="0.5"/><circle cx="204" cy="18" r="0.9" opacity="0.75"/>
    <circle cx="262" cy="30" r="0.6" opacity="0.5"/><circle cx="298" cy="16" r="0.8" opacity="0.7"/>
    <circle cx="14" cy="62" r="0.6" opacity="0.45"/><circle cx="132" cy="56" r="0.5" opacity="0.4"/>
    <path d="M238,22 l0.9,2.6 l2.6,0.9 l-2.6,0.9 l-0.9,2.6 l-0.9,-2.6 l-2.6,-0.9 l2.6,-0.9 z" opacity="0.85"/>
    <path d="M40,36 l0.7,2 l2,0.7 l-2,0.7 l-0.7,2 l-0.7,-2 l-2,-0.7 l2,-0.7 z" opacity="0.7"/>
  </g>

  <!-- skyline silhouette against the horizon glow -->
  <g fill="#022019">
    <rect x="0" y="170" width="320" height="10"/>
    <rect x="0" y="160" width="18" height="12"/><rect x="24" y="164" width="14" height="8"/>
    <rect x="116" y="162" width="20" height="10"/><path d="M119,162 a7,7 0 0 1 14,0 z"/>
    <rect x="146" y="150" width="3.6" height="22"/><path d="M145.2,150 l2.6,-7 l2.6,7 z"/><rect x="144.6" y="156" width="6.4" height="1.6"/>
    <rect x="158" y="160" width="40" height="12"/><path d="M165,160 a13,13 0 0 1 26,0 z"/><rect x="177.5" y="143" width="1" height="5"/>
    <rect x="206" y="146" width="3.6" height="26"/><path d="M205.2,146 l2.6,-8 l2.6,8 z"/><rect x="204.6" y="153" width="6.4" height="1.6"/>
    <rect x="218" y="164" width="26" height="8"/><path d="M224,164 a7,7 0 0 1 14,0 z"/>
    <rect x="252" y="158" width="16" height="14"/><rect x="272" y="152" width="3.6" height="20"/><path d="M271.2,152 l2.6,-7 l2.6,7 z"/>
    <rect x="282" y="162" width="38" height="10"/><path d="M290,162 a10,10 0 0 1 20,0 z"/>
  </g>

  <!-- mark: concept 8 -->
  <g transform="translate(70 92) scale(0.86) translate(-74 -90)">
    <path id="_8_crescent" data-name="8 crescent" d="M90.521 42.53 C64.812 35.127 37.882 49.533 29.774 75.028 C21.665 100.522 35.324 127.839 60.585 136.647 C85.846 145.455 113.529 132.554 123.03 107.545 C111.446 121.818 91.609 126.33 74.991 118.471 C58.373 110.612 49.275 92.417 52.958 74.407 C56.641 56.397 72.151 43.234 90.521 42.53 Z" fill="#fff7e0"/>
    <path id="_8_bar_1" data-name="8 bar 1" d="M83.88 74.8 L83.88 74.8 C86.189 74.8 88.06 76.671 88.06 78.98 L88.06 93.42 C88.06 95.729 86.189 97.6 83.88 97.6 L83.88 97.6 C81.571 97.6 79.7 95.729 79.7 93.42 L79.7 78.98 C79.7 76.671 81.571 74.8 83.88 74.8 Z" fill="#f5c95f"/>
    <path id="_8_bar_2" data-name="8 bar 2" d="M97.94 65.3 L97.94 65.3 C100.249 65.3 102.12 67.171 102.12 69.48 L102.12 102.92 C102.12 105.229 100.249 107.1 97.94 107.1 L97.94 107.1 C95.631 107.1 93.76 105.229 93.76 102.92 L93.76 69.48 C93.76 67.171 95.631 65.3 97.94 65.3 Z" fill="#f5c95f"/>
    <path id="_8_bar_3" data-name="8 bar 3" d="M112 72.9 L112 72.9 C114.309 72.9 116.18 74.771 116.18 77.08 L116.18 95.32 C116.18 97.629 114.309 99.5 112 99.5 L112 99.5 C109.691 99.5 107.82 97.629 107.82 95.32 L107.82 77.08 C107.82 74.771 109.691 72.9 112 72.9 Z" fill="#f5c95f"/>
  </g>

  <!-- wordmark -->
  <text x="222" y="70" text-anchor="middle" font-family="Amiri, serif" font-size="22" fill="#F5C95F" direction="rtl">الأذان</text>
  <text x="222" y="108" text-anchor="middle" font-family="'Avenir Next', sans-serif" font-size="38" fill="url(#word)">Adzan <tspan fill="#F5C95F">TV</tspan></text>
  <g fill="#F5C95F">
    <rect x="180" y="119.4" width="34" height="1.2" opacity="0.8"/><rect x="230" y="119.4" width="34" height="1.2" opacity="0.8"/>
    <path d="M222,115.5 l4.5,4.5 l-4.5,4.5 l-4.5,-4.5 z"/>
  </g>
</svg>
