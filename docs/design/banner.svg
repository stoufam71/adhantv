<!-- TV launcher banner source. Render at 640x360 (headless Chrome screenshot) to
     app/src/main/res/drawable-xhdpi/banner.png. Mark matches ic_launcher_foreground.xml. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 320 180">
  <defs>
    <style>@font-face { font-family: "Amiri"; src: url("../../app/src/main/res/font/amiri.ttf"); }</style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0A08"/><stop offset="0.6" stop-color="#1B150C"/><stop offset="1" stop-color="#4A3615"/></linearGradient>
    <radialGradient id="halo" gradientUnits="userSpaceOnUse" cx="70" cy="96" r="92">
      <stop offset="0" stop-color="#E6C67C" stop-opacity="0.34"/><stop offset="0.45" stop-color="#D9B76A" stop-opacity="0.10"/><stop offset="1" stop-color="#D9B76A" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="54" y1="37" x2="54" y2="78">
      <stop offset="0" stop-color="#F7E4AE"/><stop offset="0.5" stop-color="#D9B76A"/><stop offset="1" stop-color="#A98541"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DC"/><stop offset="1" stop-color="#E3CF9C"/></linearGradient>
    <!-- Khatam (8-point star) lattice, shown faintly on the right. -->
    <pattern id="khatam" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M13,2 L24,13 L13,24 L2,13 Z M5.2,5.2 H20.8 V20.8 H5.2 Z" fill="none" stroke="#D9B76A" stroke-width="0.45"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0.16"/></linearGradient>
    <mask id="m"><rect width="320" height="180" fill="url(#fade)"/></mask>
  </defs>

  <rect width="320" height="180" fill="url(#sky)"/>
  <rect width="320" height="180" fill="url(#khatam)" mask="url(#m)"/>
  <rect width="320" height="180" fill="url(#halo)"/>

  <!-- stars -->
  <g fill="#F7E4AE">
    <circle cx="22" cy="20" r="0.9" opacity="0.8"/><circle cx="118" cy="16" r="0.7" opacity="0.6"/>
    <circle cx="150" cy="34" r="0.6" opacity="0.5"/><circle cx="204" cy="18" r="0.9" opacity="0.75"/>
    <circle cx="262" cy="30" r="0.6" opacity="0.5"/><circle cx="298" cy="16" r="0.8" opacity="0.7"/>
    <circle cx="14" cy="62" r="0.6" opacity="0.45"/><circle cx="132" cy="56" r="0.5" opacity="0.4"/>
    <path d="M238,22 l0.9,2.6 l2.6,0.9 l-2.6,0.9 l-0.9,2.6 l-0.9,-2.6 l-2.6,-0.9 l2.6,-0.9 z" opacity="0.85"/>
    <path d="M40,36 l0.7,2 l2,0.7 l-2,0.7 l-0.7,2 l-0.7,-2 l-2,-0.7 l2,-0.7 z" opacity="0.7"/>
  </g>

  <!-- skyline silhouette against the horizon glow -->
  <g fill="#0E0B07">
    <rect x="0" y="170" width="320" height="10"/>
    <rect x="0" y="160" width="18" height="12"/><rect x="24" y="164" width="14" height="8"/>
    <rect x="116" y="162" width="20" height="10"/><path d="M119,162 a7,7 0 0 1 14,0 z"/>
    <rect x="146" y="150" width="3.6" height="22"/><path d="M145.2,150 l2.6,-7 l2.6,7 z"/><rect x="144.6" y="156" width="6.4" height="1.6"/>
    <rect x="158" y="160" width="40" height="12"/><path d="M165,160 a13,13 0 0 1 26,0 z"/><rect x="177.5" y="143" width="1" height="5"/>
    <rect x="206" y="146" width="3.6" height="26"/><path d="M205.2,146 l2.6,-8 l2.6,8 z"/><rect x="204.6" y="153" width="6.4" height="1.6"/>
    <rect x="218" y="164" width="26" height="8"/><path d="M224,164 a7,7 0 0 1 14,0 z"/>
    <rect x="252" y="158" width="16" height="14"/><rect x="272" y="152" width="3.6" height="20"/><path d="M271.2,152 l2.6,-7 l2.6,7 z"/>
    <rect x="282" y="162" width="38" height="10"/><path d="M290,162 a10,10 0 0 1 20,0 z"/>
  </g>

  <!-- mark -->
  <g transform="translate(70 92) scale(1.9) translate(-54 -52.8)">
    <path d="M40,72 c-4,-10 -2,-18 6,-24 c4,-3 7,-6 8,-11 c1,5 4,8 8,11 c8,6 10,14 6,24 z" fill="url(#gold)"/>
    <rect x="37" y="73.5" width="34" height="4.5" rx="1.2" fill="#B8964F"/>
    <path d="M50,72 v-7.5 c0,-3 2,-4.7 4,-6.5 c2,1.8 4,3.5 4,6.5 v7.5 z" fill="#1A140B"/>
    <rect x="53.4" y="34" width="1.2" height="3.6" fill="#F7E4AE"/>
    <path d="M54.575,27.646 a3.6,3.6 0 1,0 2.518,5.396 a3,3 0 1,1 -2.518,-5.396 z" fill="#F7E4AE"/>
    <g fill="none" stroke="#D9B76A" stroke-width="2.6" stroke-linecap="round">
      <path d="M75.19,46.73 a24,24 0 0,1 0,22.54 M32.81,46.73 a24,24 0 0,0 0,22.54"/>
      <path d="M80.95,46 a29.5,29.5 0 0,1 0,24 M27.05,46 a29.5,29.5 0 0,0 0,24" opacity="0.5"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="222" y="70" text-anchor="middle" font-family="Amiri, serif" font-size="22" fill="#D9B76A" direction="rtl">الأذان</text>
  <text x="222" y="108" text-anchor="middle" font-family="Amiri, Georgia, serif" font-size="38" fill="url(#word)">Adzan <tspan fill="#E6C67C">TV</tspan></text>
  <g fill="#D9B76A">
    <rect x="180" y="119.4" width="34" height="1.2" opacity="0.8"/><rect x="230" y="119.4" width="34" height="1.2" opacity="0.8"/>
    <path d="M222,115.5 l4.5,4.5 l-4.5,4.5 l-4.5,-4.5 z"/>
  </g>
</svg>
