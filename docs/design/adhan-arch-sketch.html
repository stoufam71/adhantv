<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adhan arch options</title>
<style>
  :root { --page: #1b1b1b; --ink: #e8e8e8; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--page); color: var(--ink); font-family: system-ui, sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p.lede { margin: 0 0 24px; color: #aaa; font-size: 14px; max-width: 72ch; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 620px), 1fr)); gap: 28px; }
  figure { margin: 0; }
  figcaption { margin: 10px 0 0; font-size: 14px; color: #bbb; }
  figcaption b { display: block; font-size: 16px; color: var(--ink); margin-bottom: 2px; }
  .tv { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 6px; container-type: inline-size; }
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(calc(100cqw / 1920px)); background: #0B0A08; font-family: "Noto Serif", Georgia, serif; overflow: hidden; }
  .stage svg { position: absolute; overflow: visible; }
  .col { position: absolute; left: 0; width: 1920px; display: flex; flex-direction: column; align-items: center; text-align: center; transform-origin: 960px 0; }
  .hayya { color: #D9B76A; font-size: 54px; line-height: 1.4; font-family: "Amiri", "Noto Naskh Arabic", serif; }
  .lbl { color: #8C8370; font: 22px system-ui, sans-serif; letter-spacing: .12em; margin-top: 24px; }
  .name { color: #D8CDB4; font-size: 128px; font-weight: 700; line-height: 1.1; }
  .ar { color: #D9B76A; font-size: 40px; line-height: 1.4; font-family: "Amiri", "Noto Naskh Arabic", serif; }
  .meta { color: #8C8370; font: 28px system-ui, sans-serif; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .bar { width: 440px; margin-top: 36px; }
  .track { height: 4px; border-radius: 2px; background: rgba(216,205,180,.25); }
  .fill { height: 4px; width: 9%; border-radius: 2px; background: #D9B76A; }
  .pt { color: #8C8370; font: 22px system-ui, sans-serif; margin-top: 10px; }
  .pill { margin-top: 44px; padding: 6px; border: 4px solid #D8CDB4; border-radius: 999px; }
  .pill span { display: block; width: 420px; padding: 18px 0; border-radius: 999px; background: #D9B76A; color: #0B0A08; font: 500 28px system-ui, sans-serif; }
  .hint { color: #8C8370; font: 22px system-ui, sans-serif; margin-top: 16px; }
</style>
</head>
<body>
<h1>Adzan TV: adhan screen arch options</h1>
<p class="lede">The adhan card on a 1920×1080 TV in the Kiswah palette, with the same content in each. Every arch keeps the mihrab's true 2:3 shape; what changes is its size and whether its bottom shows.</p>
<div class="grid" id="grid"></div>

<template id="screen">
  <div class="tv"><div class="stage">
    <svg class="orn" width="1920" height="1080" aria-hidden="true"></svg>
    <svg class="arch" viewBox="0 0 600 900" aria-hidden="true">
      <path class="fill-arch" d="M0 900 L0 330 C0 170 140 70 300 0 C460 70 600 170 600 330 L600 900 Z" fill="#17140F"/>
      <path d="M0 900 L0 330 C0 170 140 70 300 0 C460 70 600 170 600 330 L600 900" fill="none" stroke="#E8D3A6" stroke-width="6" vector-effect="non-scaling-stroke"/>
      <path d="M18 900 L18 334 C18 184 150 92 300 22 C450 92 582 184 582 334 L582 900" fill="none" stroke="#B8964F" stroke-opacity=".55" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    </svg>
    <svg class="base" width="1920" height="1080" aria-hidden="true"></svg>
    <div class="col">
      <div class="hayya">حَيَّ عَلَى الصَّلَاةِ</div>
      <div class="lbl">WAKTUNYA SHALAT</div>
      <div class="name">Subuh</div>
      <div class="ar">صَلَاةُ الصُّبْح</div>
      <div class="meta">04:09 · KOTA JAKARTA</div>
      <div class="bar"><div class="track"><div class="fill"></div></div><div class="pt">0:13 / 2:34</div></div>
      <div class="pill"><span>Hentikan adzan</span></div>
      <div class="hint">OK atau Kembali</div>
    </div>
  </div></div>
</template>

<script>
  const W = 1920, H = 1080;

  // Hankin rosette, same as the app (4.8.8 tiling at 67.5°), for an honest background
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1]], add = (a, b) => [a[0] + b[0], a[1] + b[1]], mul = (a, k) => [a[0] * k, a[1] * k];
  const norm = (a) => { const l = Math.hypot(a[0], a[1]); return [a[0] / l, a[1] / l]; };
  function intersect(p, d, q, e) { const den = d[0] * e[1] - d[1] * e[0]; if (Math.abs(den) < 1e-9) return null; const t = ((q[0] - p[0]) * e[1] - (q[1] - p[1]) * e[0]) / den; return add(p, mul(d, t)); }
  const poly = (cx, cy, n, R, rot) => Array.from({ length: n }, (_, i) => { const a = rot + (i * 2 * Math.PI) / n; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  function hankin(vs, th) {
    const n = vs.length, out = [], c = vs.reduce((s, v) => add(s, mul(v, 1 / n)), [0, 0]);
    const rays = vs.map((v, i) => { const w = vs[(i + 1) % n], m = mul(add(v, w), .5), d = norm(sub(w, v)); let nr = [-d[1], d[0]]; if ((c[0] - m[0]) * nr[0] + (c[1] - m[1]) * nr[1] < 0) nr = mul(nr, -1); return { m, f: add(mul(d, Math.cos(th)), mul(nr, Math.sin(th))), b: add(mul(d, -Math.cos(th)), mul(nr, Math.sin(th))) }; });
    for (let i = 0; i < n; i++) { const a = rays[i], b = rays[(i + 1) % n], x = intersect(a.m, a.f, b.m, b.b); if (x) out.push([a.m, x], [x, b.m]); }
    return out;
  }
  function rosette(P) {
    const a = P / (1 + Math.SQRT2), R = a / (2 * Math.sin(Math.PI / 8)), th = 67.5 * Math.PI / 180; let d = "";
    for (let x = -P; x <= W + P; x += P) for (let y = -P; y <= H + P; y += P)
      for (const [p, q] of [...hankin(poly(x, y, 8, R, Math.PI / 8), th), ...hankin(poly(x + P / 2, y + P / 2, 4, a / Math.SQRT2, 0), th)])
        d += `M${p[0].toFixed(1)} ${p[1].toFixed(1)}L${q[0].toFixed(1)} ${q[1].toFixed(1)}`;
    return d;
  }
  const ORN = rosette(220);

  // w: arch width (height is 1.5×), top: arch top, col: content top, scale: content scale, base: draw a floor line
  const options = [
    { name: "A · Now", note: "720 wide, top at 110, runs off the bottom. A tall, narrow niche in the middle of a wide screen.", w: 720, top: 110, col: 205, scale: 1 },
    { name: "B · Wider arch", note: "920 wide, same shape, runs off the bottom. Fills more of the 16:9 screen; the text has room to breathe.", w: 920, top: 70, col: 230, scale: 1.05 },
    { name: "C · Whole arch visible", note: "Smaller (600 wide) so the full mihrab fits, standing on a gold base line like a real prayer niche. Content scaled down to fit inside.", w: 600, top: 70, col: 215, scale: 0.86, base: true },
    { name: "D · Same as screensaver", note: "Exactly the screensaver's 600×900 arch, centred and set low, so the two screens match.", w: 600, top: 200, col: 330, scale: 0.86 },
  ];

  const grid = document.getElementById("grid"), tpl = document.getElementById("screen");
  options.forEach((o) => {
    const tv = tpl.content.cloneNode(true);
    tv.querySelector("svg.orn").innerHTML = `<g opacity=".09"><path d="${ORN}" fill="none" stroke="#B8964F" stroke-width="8" stroke-linejoin="round"/><path d="${ORN}" fill="none" stroke="#0B0A08" stroke-width="4" stroke-linejoin="round"/></g>`;
    const h = o.w * 1.5, arch = tv.querySelector("svg.arch");
    arch.setAttribute("width", o.w); arch.setAttribute("height", h);
    arch.style.left = (W - o.w) / 2 + "px"; arch.style.top = o.top + "px";
    if (o.base) {
      // close the niche at a floor line instead of letting it run off the screen
      const floor = o.top + h * 0.9;
      // crop the sides at the floor; the 10-unit margin keeps the apex stroke whole
      arch.setAttribute("viewBox", "0 -10 600 820"); arch.setAttribute("height", h * 820 / 900);
      arch.style.top = o.top - h * 10 / 900 + "px"; arch.style.overflow = "hidden";
      const x0 = (W - o.w) / 2;
      tv.querySelector("svg.base").innerHTML =
        `<path d="M${x0 - 60} ${floor + 3}H${x0 + o.w + 60}" stroke="#B8964F" stroke-width="3"/>` +
        `<path d="M${x0 - 30} ${floor + 16}H${x0 + o.w + 30}" stroke="#B8964F" stroke-opacity=".55" stroke-width="1.5"/>`;
    }
    const col = tv.querySelector(".col");
    col.style.top = o.col + "px"; col.style.transform = `scale(${o.scale})`;
    const fig = document.createElement("figure"); fig.appendChild(tv);
    const cap = document.createElement("figcaption"), b = document.createElement("b");
    b.textContent = o.name; cap.append(b, o.note); fig.appendChild(cap);
    grid.appendChild(fig);
  });
</script>
</body>
</html>
